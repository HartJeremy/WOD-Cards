<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Deck WOD</title>
<style>
:root{--bg:#0a0c12;--panel:#12172a;--panel2:#1a1f35;--line:#1e2540;--line2:#2a3050;--text:#e8e8f0;--muted:#667;--faint:#445;--gold:#fbbf24;--red:#f87171;--blue:#60a5fa;--green:#4ade80;--purple:#c084fc}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Georgia,serif;padding-bottom:40px} button,input,textarea{font-family:inherit} button{cursor:pointer}
.header{background:#0e1220;border-bottom:1px solid var(--line);padding:18px 16px 0}.wrap,.main{max-width:470px;margin:0 auto}.main{padding:18px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.kicker{font-size:10px;letter-spacing:3px;color:var(--faint)}.title{font-size:20px;font-weight:bold;letter-spacing:1px}.settingsButton{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--gold);min-width:130px}.settingsButton div:last-child{font-size:9px;color:var(--faint);letter-spacing:1px;margin-top:2px}.tabs{display:flex}.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--faint);padding:10px 4px;letter-spacing:1px;font-size:12px}.tab.active{border-bottom-color:var(--gold);color:var(--gold)}
.panel,.settings-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.label{font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:6px;text-transform:uppercase}.small{font-size:11px;color:#667}.hint{font-size:10px;color:#556;text-align:center;margin-top:4px}.btn{border:1px solid var(--line2);border-radius:10px;background:var(--panel2);color:#889;padding:8px 10px}.pill{border:1px solid var(--line2);border-radius:999px;background:transparent;color:#889;padding:6px 12px;font-size:11px}.pill.active{background:var(--line2);color:var(--text)}.adjust{display:flex;align-items:center;gap:6px}.adjust button{width:32px;height:32px;border-radius:8px;font-size:18px}.big{flex:1;text-align:center;font-size:22px;font-weight:bold}
.progress{height:5px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 10px}.fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--red))}.suits{display:grid;grid-template-columns:1fr 1fr;gap:8px}.suitrow{display:flex;align-items:center;gap:8px}.miniProgress{height:3px;background:var(--line);border-radius:4px;overflow:hidden}.exerciseLine{display:flex;align-items:center;gap:10px;margin:8px 0}.deal-info{text-align:center;font-size:11px;color:var(--faint);margin:10px 0}.mainBtn{width:100%;padding:16px;border-radius:14px;border:1px solid #fbbf2444;background:linear-gradient(135deg,#12172a,#1a2540);color:var(--gold);font-size:16px;letter-spacing:3px;font-weight:bold}
.equip{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--panel2);border:1px solid var(--line2);color:#889;border-radius:10px;padding:9px 12px;margin:7px 0}.equip.on{border-color:#fbbf2455;background:#201d13;color:var(--text)}.toggle{width:34px;height:18px;border-radius:999px;background:#2a3050;padding:2px;flex-shrink:0}.toggle span{display:block;width:14px;height:14px;border-radius:50%;background:#667;transition:.2s}.equip.on .toggle{background:#fbbf2444}.equip.on .toggle span{background:var(--gold);transform:translateX(16px)}.mode-badge{display:inline-block;border:1px solid #fbbf2444;color:var(--gold);border-radius:999px;padding:3px 8px;font-size:10px;letter-spacing:1px;margin-bottom:8px}
.option{width:100%;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:#889;text-align:left;padding:9px 12px;margin:5px 0;font-size:13px}.option.selected{font-weight:bold}.exercise-info{margin-top:6px;font-size:10px;color:#667;line-height:1.35}.exercise-info b{color:#889}.option .exercise-info{margin-left:18px}.card{background:var(--panel);border-radius:14px;padding:16px;margin:10px 0;border:1px solid var(--line)}.card.done{background:#0d1a10;opacity:.62;border-color:#4ade8033!important}.card.bonus{background:#171320}.cardTop{display:flex;align-items:center;gap:14px}.miniCard{width:64px;height:82px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;flex-shrink:0}.cardName{font-size:14px;font-weight:bold}.reps{font-size:24px;font-weight:bold}.controls{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.feels{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.feel{border:1px solid var(--line2);background:var(--line);color:var(--muted);border-radius:999px;padding:4px 8px;font-size:11px}input,textarea{width:100%;background:var(--line);border:1px solid var(--line2);border-radius:9px;color:var(--text);padding:9px;margin-bottom:8px}.doneBtn{width:100%;padding:10px;border-radius:10px;border:1px solid #4ade8044;background:linear-gradient(135deg,#14532d,#166534);color:var(--green);letter-spacing:2px;font-weight:bold}.event{background:#181525;border:1px solid #fbbf2444;border-radius:12px;padding:10px 12px;margin:8px 0}.event strong{color:var(--gold);font-size:12px;letter-spacing:1px}.postbox{background:#0d1a10;border:1px solid #4ade8033;border-radius:14px;padding:14px;margin-top:12px}.postbox textarea{min-height:180px;font-family:Arial,sans-serif;line-height:1.35;background:#0f1424}.historyItem{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin:8px 0}.empty{text-align:center;color:var(--faint);padding:42px}.footer-credit{text-align:center;color:#445;font-size:11px;margin:28px 0 10px;letter-spacing:1px}@media(max-width:380px){.grid2,.suits{grid-template-columns:1fr}}


.handWrap{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px 10px 18px;
  margin-bottom:14px;
  overflow:hidden;
}
.hand{
  display:flex;
  justify-content:center;
  align-items:flex-end;
  min-height:138px;
  margin:4px 0 12px;
  padding:0 8px;
}
.handCard{
  width:76px;
  height:108px;
  position:relative;
  margin-left:-23px;
  perspective:900px;
  flex-shrink:0;
  transition:transform .2s ease;
}
.handCard:first-child{margin-left:0}
.handCard:nth-child(1){transform:rotate(-10deg)}
.handCard:nth-child(2){transform:rotate(-5deg) translateY(-2px)}
.handCard:nth-child(3){transform:rotate(0deg) translateY(-4px)}
.handCard:nth-child(4){transform:rotate(5deg) translateY(-2px)}
.handCard:nth-child(5){transform:rotate(10deg)}
.handCard:nth-child(n+6){transform:rotate(12deg)}
.handCardInner{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .55s ease;
}
.handCard.revealed .handCardInner{transform:rotateY(180deg)}
.cardFace,.cardBack{
  position:absolute;
  inset:0;
  border-radius:12px;
  backface-visibility:hidden;
  box-shadow:0 8px 20px #0008;
  overflow:hidden;
}

.cardFace{

  display:flex;
  flex-direction:column;
  padding:8px;

  flex:1;

.cardCenterSuit{
  font-size:48px;
  line-height:1;
}
.cardBottom{display:none}
.handHint{
  text-align:center;
  color:#667;
  font-size:11px;
  margin-top:4px;
}
.revealBtn{
  width:100%;
  padding:11px;
  border-radius:12px;
  border:1px solid #fbbf2444;
  background:#fbbf2418;
  color:#fbbf24;
  font-weight:bold;
  letter-spacing:2px;
}

  .handCard{width:66px;height:94px;margin-left:-24px}

/* v28 safe card display patch */
.hand{
  display:flex!important;
  justify-content:center!important;
  align-items:flex-end!important;
  flex-wrap:wrap!important;
  gap:10px 6px!important;
  max-width:500px!important;
  margin-left:auto!important;
  margin-right:auto!important;
}
.handCard{
  margin-left:0!important;
}
.hand.wrapRows{
  max-width:492px!important;
}
@media(max-width:390px){
  .hand.wrapRows{
    max-width:306px!important;
  }
}
.cardFace{
  transform:rotateY(180deg);
  background:#f8fafc;
  border:2px solid #e5e7eb;
  color:#111827;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  flex-direction:column!important;
  padding:6px!important;
}
.cardCorner,
.cardBottom,
.cardCenter{
  display:none!important;
}
.cardCenterWrap{
  flex:1!important;
  width:100%!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  flex-direction:column!important;
  text-align:center!important;
  gap:5px!important;
}
.cardCenterRank{
  display:block!important;
  font-size:38px!important;
  line-height:1!important;
  font-weight:bold!important;
}
.cardCenterSuit{
  display:block!important;
  font-size:46px!important;
  line-height:1!important;
}
@media(max-width:390px){
  .cardCenterRank{font-size:34px!important}
  .cardCenterSuit{font-size:42px!important}
}


/* v29 editable face cards */
.faceEdit{
  background:var(--panel2);
  border:1px solid var(--line2);
  border-radius:12px;
  padding:10px;
  margin:8px 0;
}
.faceEditTitle{
  font-size:13px;
  font-weight:bold;
  color:var(--gold);
  margin-bottom:8px;
}
.faceTaskGrid{
  display:grid;
  grid-template-columns:58px 1fr 70px;
  gap:6px;
  align-items:center;
  margin:6px 0;
}
.faceTaskGrid input,
.faceTaskGrid select{
  margin:0;
  background:var(--line);
  border:1px solid var(--line2);
  border-radius:8px;
  color:var(--text);
  padding:8px;
  font-size:12px;
}
.faceTaskGrid select{width:100%}
@media(max-width:390px){
  .faceTaskGrid{grid-template-columns:46px 1fr 60px}
}

function homeHTML(done,totalToday,totalLogged){const deckNum=state.deckNumber||1,deckSize=isClassic()&&state.classicJokers?54:52,target=deckNum*deckSize;const bySuit=Object.fromEntries(Object.keys(SUITS).map(s=>[s,state.logged.filter(w=>w.suit===s).length]));return `<div class="panel"><span class="mode-badge">${isClassic()?"CLASSIC DECK":"WOD-CARDS"}</span><div class="row"><div class="small">Deck ${deckNum} · ${state.logged.length}/${target} cards · ${(state.lifetimeCards||0)} lifetime</div><div style="color:var(--gold);font-size:11px;font-weight:bold">${totalLogged.toLocaleString()} reps</div></div><div class="progress"><div class="fill" style="width:${Math.min(100,Math.round(state.logged.length/target*100))}%"></div></div>${isClassic()?`<div class="small">Draw ${state.classicCardsPerDraw} cards · ×${state.classicMultiplier} · ${state.deck.length} cards left</div><div class="suits" style="margin-top:10px">${Object.entries(CLASSIC_SUITS).map(([s,i])=>`<div class="suitrow"><span style="color:${i.color};font-size:16px;width:18px">${i.symbol}</span><div class="small">${classicSuitInfo(s).exercise}${classicSuitInfo(s).unit==="sec"?" · sec":""}</div></div>`).join("")}</div>`:`<div class="suits">${Object.entries(SUITS).map(([s,i])=>`<div class="suitrow"><span style="color:${i.color};font-size:16px;width:18px">${i.symbol}</span><div style="flex:1"><div class="row"><span class="small">${i.name}</span><span class="small" style="color:${i.color}">${bySuit[s]}/${deckNum*13}</span></div><div class="miniProgress"><div style="height:100%;width:${Math.min(100,bySuit[s]/(deckNum*13)*100)}%;background:${i.color}"></div></div></div></div>`).join("")}</div>`}</div>${state.today.length?todayHTML(done,totalToday):dealHTML()}`}
function dealHTML(){if(isClassic())return `<div class="panel"><div class="label">Classic Deck Setup</div>${Object.entries(CLASSIC_SUITS).map(([s,i])=>`<div class="exerciseLine"><span style="color:${i.color};font-size:18px;width:22px">${i.symbol}</span><span style="font-size:12px;color:#ccd">${classicSuitInfo(s).exercise}${classicSuitInfo(s).unit==="sec"?" (seconds)":""}</span></div>`).join("")}<div class="exerciseLine" style="border-top:1px solid var(--line);padding-top:8px"><span style="width:45px">J/Q/K/A</span><span class="small">20 Burpees / 20 Push-ups / 50 Squats / 15 Burpees + 30 Squats</span></div><div class="exerciseLine"><span style="width:45px">🃏</span><span class="small">Joker repeats all non-joker cards drawn.</span></div></div><div class="deal-info">${state.deck.length} cards left · dealing ${state.classicCardsPerDraw}</div><button class="mainBtn" data-act="deal">DEAL ${state.classicCardsPerDraw} CARDS</button>`;return `<div class="panel"><div class="label">Today's Exercises</div>${Object.entries(SUITS).map(([s,i])=>`<div class="exerciseLine"><span style="color:${i.color};font-size:18px;width:22px">${i.symbol}</span><span style="font-size:12px;color:#ccd">${esc(state.selected[s])}</span></div>`).join("")}<div class="exerciseLine" style="border-top:1px solid var(--line);padding-top:8px"><span style="width:22px">🃏</span><span class="small">${esc(state.faceExercise)} (J/Q/K/A)</span></div></div><div class="deal-info">${state.deck.length} cards left · dealing ${state.cardsPerDay}${state.comboOn?" · combos on":""}</div><button class="mainBtn" data-act="deal">DEAL ${state.cardsPerDay} CARDS</button>`}
function todayHTML(done,totalToday){

function cardHTML(c,i){const info=isJoker(c)?{symbol:"🃏",color:"var(--purple)",name:"Joker"}:c.bonus?{symbol:"★",color:"var(--purple)",name:"Bonus"}:isClassic()?CLASSIC_SUITS[c.suit]:SUITS[c.suit];const ex=displayExercise(c),amt=displayReps(c),unit=displayUnit(c);return `<div class="card ${c.done?"done":""} ${c.bonus||c.repeated||isJoker(c)?"bonus":""}" style="border-color:${c.done?"#4ade8033":info.color+"66"}"><div class="cardTop"><div class="miniCard" style="border:1px solid ${info.color}66"><div style="font-size:30px;color:${info.color};line-height:1">${info.symbol}</div><div style="font-size:16px;font-weight:bold;color:${info.color}">${isJoker(c)?"":esc(c.face)}</div></div><div style="flex:1"><div class="row"><div class="cardName" style="color:${info.color}">${esc(ex)}</div><div class="reps">${isJoker(c)?"JOKER":amt+(unit==="sec"?"s":"")}</div></div><div class="small">${isJoker(c)?"Repeat all non-joker cards drawn this session":isClassic()?`${c.repeated?"Repeat · ":""}${unit==="sec"?amt+" sec ":amt+" "}${esc(ex)}`:c.bonus?`Bonus · ${esc(c.name)}`:`${isFace(c.face)?"Full Body":info.name} · ${isFace(c.face)?`${c.face} = ${cardReps(c)}`:`${c.face}×${state.multiplier}`}`}</div>${!isJoker(c)?exerciseInfo(ex):""}</div></div>${c.done?`<div class="small" style="color:var(--green);margin-top:8px">✓ Complete ${state.feel[i]?`· ${esc(state.feel[i])}`:""}</div>`:`<div class="controls"><div class="feels">${FEELS.map(f=>`<button class="feel" data-feel="${i}|${esc(f)}">${f}</button>`).join("")}</div><input data-note="${i}" value="${esc(state.notes[i]||"")}" placeholder="Notes (optional)"><button class="doneBtn" data-done="${i}">✓ DONE</button></div>`}</div>`}
function completeHTML(total){const post=state.post||makePost(state.today,state.events);return `<div class="postbox"><div style="text-align:center;font-size:28px">🔥</div><div style="text-align:center;color:var(--green);font-weight:bold">WOD Complete!</div><div class="small" style="text-align:center;margin:4px 0 12px">${total} total · ${state.today.length} cards</div><textarea id="postText">${esc(post)}</textarea><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="pill" data-act="copy">Copy Post</button><button class="pill" data-act="newpost">New Version</button><button class="pill" data-act="rest">Clear & Rest</button></div></div>`}
function exercisesHTML(){if(isClassic())return `<div class="panel"><span class="mode-badge">CLASSIC DECK</span><div class="label">Suit Rules</div>${Object.entries(CLASSIC_SUITS).map(([s,i])=>`<div class="equip"><span><b style="color:${i.color}">${i.symbol} ${i.name}</b><br><span class="small">${i.exercise}${i.unit==="sec"?" · seconds":" · reps"}</span>${exerciseInfo(i.exercise)}</span></div>`).join("")}<div class="label" style="margin-top:12px">Face Cards</div><div class="small">J = 20 Burpees<br>Q = 20 Push-ups<br>K = 50 Squats<br>A = 15 Burpees + 30 Squats<br><br>🃏 Joker = repeat all non-joker cards drawn this session.</div></div>`;return `<div class="row" style="margin-bottom:14px"><div class="label" style="margin:0">Select Exercises</div><button class="pill" data-act="randomAll">🎲 Randomize All</button></div>${Object.entries(SUITS).map(([s,i])=>`<div class="panel" style="border-color:${i.color}55"><div class="row" style="margin-bottom:10px"><div><div style="font-weight:bold">${i.symbol} ${i.name}</div><div class="small">2-10 × ${state.multiplier} reps</div></div><button class="pill" data-random-suit="${s}">🎲</button></div>${availableExercises(s).map(ex=>`<button class="option ${state.selected[s]===ex?"selected":""}" style="${state.selected[s]===ex?`border-color:${i.color};color:${i.color};background:${i.color}22`:""}" data-select="${s}|${esc(ex)}">${state.selected[s]===ex?"●":"○"} ${esc(ex)}${state.selected[s]===ex?exerciseInfo(ex):""}</button>`).join("")}</div>`).join("")}<div class="panel"><div class="row" style="margin-bottom:10px"><div><div style="font-weight:bold">🃏 Face Cards · Full Body</div><div class="small">J=20 · Q=30 · K=40 · A=50</div></div><button class="pill" data-act="randomFace">🎲</button></div>${availableFull().map(ex=>`<button class="option ${state.faceExercise===ex?"selected":""}" style="${state.faceExercise===ex?"border-color:#aaa;color:var(--text);background:#ffffff22":""}" data-face="${esc(ex)}">${state.faceExercise===ex?"●":"○"} ${esc(ex)}${state.faceExercise===ex?exerciseInfo(ex):""}</button>`).join("")}</div>`}
function historyHTML(total){return `<div class="label">History · ${state.logged.length} sets · ${total.toLocaleString()} total reps</div>${!state.logged.length?`<div class="empty"><div style="font-size:40px">📋</div><div>No workouts yet.</div></div>`:""}${state.logged.map(w=>{const info=w.suit==="joker"?{symbol:"🃏",color:"var(--purple)"}:w.bonus?{symbol:"★",color:"var(--purple)"}:SUITS[w.suit]||CLASSIC_SUITS[w.suit]||{symbol:"•",color:"#888"};return `<div class="historyItem"><div class="miniCard" style="width:42px;height:52px;border:1px solid ${info.color}66"><div style="color:${info.color};font-size:18px">${info.symbol}</div><div style="color:${info.color};font-size:11px;font-weight:bold">${esc(w.face)}</div></div><div style="flex:1"><div class="row"><b style="font-size:13px;color:${info.color}">${esc(w.exercise)}</b><b>${w.reps}${w.unit==="sec"?"s":""}</b></div><div class="small">${[w.feel,w.date].filter(Boolean).map(esc).join(" · ")}</div>${w.notes?`<div class="small"><i>${esc(w.notes)}</i></div>`:""}</div></div>`}).join("")}`}
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;if(t.dataset.view)update({view:t.dataset.view});const a=t.dataset.act;
  if(t.dataset.classicSuit){
    const s=t.dataset.classicSuit;
    const ex=t.dataset.classicName;
    const unit=t.dataset.classicUnit || "reps";
    state.classicSelected={...state.classicSelected,[s]:{exercise:ex,unit}};

    render();
    return;
  }
if(a==="settings")update({showSettings:!state.showSettings});if(t.dataset.style){state.workoutStyle=t.dataset.style;state.deck=currentDeck();state.today=[];state.events=[];save();render();return;}if(a==="mult-")update({multiplier:Math.max(1,state.multiplier-1)});if(a==="mult+")update({multiplier:Math.min(20,state.multiplier+1)});if(a==="cards-")update({cardsPerDay:Math.max(1,state.cardsPerDay-1)});if(a==="cards+")update({cardsPerDay:Math.min(13,state.cardsPerDay+1)});if(a==="classicCards-")update({classicCardsPerDraw:Math.max(1,state.classicCardsPerDraw-1)});if(a==="classicCards+")update({classicCardsPerDraw:Math.min(13,state.classicCardsPerDraw+1)});if(a==="classicMult-")update({classicMultiplier:Math.max(1,state.classicMultiplier-1)});if(a==="classicMult+")update({classicMultiplier:Math.min(30,state.classicMultiplier+1)});if(a==="resetClassicExercises")update({classicSelected:defaultClassicSelected()});if(a==="resetClassicFace")update({classicFace:defaultClassicFace()});
  if(a==="classicJokers"){state.classicJokers=!state.classicJokers;state.deck=currentDeck();state.today=[];state.events=[];save();render();return;}if(a==="combos")update({comboOn:!state.comboOn});if(a==="deal")deal();if(a==="clear")clearDay();if(a==="rest")update({today:[],events:[],post:"",revealedCards:[]});if(a==="randomAll")randomAll();if(a==="randomFace")update({faceExercise:pickRandom(availableFull(),state.faceExercise)});if(a==="newpost")update({post:makePost(state.today,state.events)});if(a==="copy"){const txt=$("postText");if(txt){txt.select();try{await navigator.clipboard.writeText(txt.value)}catch(err){document.execCommand("copy")}t.textContent="Copied"}}if(t.dataset.classicPreset){const [c,m]=t.dataset.classicPreset.split(",").map(Number);update({classicCardsPerDraw:c,classicMultiplier:m})}if(t.dataset.equip)update({equipment:{...state.equipment,[t.dataset.equip]:!state.equipment[t.dataset.equip]}});if(t.dataset.randomSuit){const s=t.dataset.randomSuit;update({selected:{...state.selected,[s]:pickRandom(availableExercises(s),state.selected[s])}})}if(t.dataset.select){const [s,ex]=t.dataset.select.split("|");update({selected:{...state.selected,[s]:ex}})}if(t.dataset.face)update({faceExercise:t.dataset.face});if(t.dataset.feel){const [i,f]=t.dataset.feel.split("|");update({feel:{...state.feel,[i]:f}})}if(t.dataset.done)doneCard(Number(t.dataset.done));});
document.addEventListener("input",e=>{
  if(e.target.dataset.note!==undefined){state.notes[e.target.dataset.note]=e.target.value;save();}
  if(e.target.dataset.faceAmount){
    const [face,idx]=e.target.dataset.faceAmount.split("|");
    const cf={...classicFaceConfig()};
    cf[face]=[...(cf[face]||[])];

});
document.addEventListener("change",e=>{

});function pickRandom(arr,exclude){const p=arr.filter(x=>x!==exclude);return rand(p.length?p:arr)}function clearDay(){const unfinished=state.today.filter(c=>!c.done&&!c.bonus&&!c.repeated&&!isJoker(c)).map(c=>({suit:c.suit,face:c.face,id:c.id}));update({deck:shuffle([...state.deck,...unfinished]),today:[],events:[],feel:{},notes:{},post:"",revealedCards:[]})}function randomAll(){const selected={...state.selected};Object.keys(SUITS).forEach(s=>selected[s]=pickRandom(availableExercises(s),selected[s]));update({selected,faceExercise:pickRandom(availableFull(),state.faceExercise)})}render();
